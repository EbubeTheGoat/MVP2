<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaCast — Demand Decision Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface-2: #f0eeea;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text-muted: #6b6b67;
      --text-faint: #9b9b96;
      --green: #3B6D11; --green-bg: #EAF3DE; --green-mid: #639922;
      --amber: #854F0B; --amber-bg: #FAEEDA; --amber-mid: #BA7517;
      --red: #A32D2D;   --red-bg: #FCEBEB;   --red-mid: #E24B4A;
      --blue: #185FA5;  --blue-bg: #E6F1FB;  --blue-mid: #378ADD;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* --- Layout --- */
    header {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .logo { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
    header .logo span { color: var(--green-mid); }
    header .last-updated { font-size: 12px; color: var(--text-faint); }

    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 56px); }

    /* --- Sidebar --- */
    aside {
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      padding: 1rem 0;
    }
    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      padding: 0 1rem 6px;
    }
    .drug-item {
      padding: 8px 1rem;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drug-item:hover { background: var(--surface-2); }
    .drug-item.active {
      border-left-color: var(--green-mid);
      background: var(--green-bg);
      font-weight: 500;
    }
    .drug-status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* --- Main content --- */
    main { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }

    /* --- Controls row --- */
    .controls-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
    .ctrl-group label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .ctrl-group input[type=number],
    .ctrl-group select {
      height: 34px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      font-size: 13px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    .ctrl-group input[type=number]:focus,
    .ctrl-group select:focus { border-color: var(--blue-mid); }
    .btn {
      height: 34px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      border: 0.5px solid var(--border-strong);
      background: var(--text);
      color: var(--surface);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      align-self: flex-end;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* --- Decision banner --- */
    .banner {
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .banner-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .banner-title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
    .banner-msg { font-size: 13px; line-height: 1.6; }
    .banner.ok    { background: var(--green-bg); color: var(--green); }
    .banner.reorder { background: var(--amber-bg); color: var(--amber); }
    .banner.stockout { background: var(--red-bg); color: var(--red); }

    /* --- Metric cards --- */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .metric {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .metric .val { font-size: 22px; font-weight: 600; line-height: 1.2; }
    .metric .lbl { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .metric .sub { font-size: 11px; margin-top: 4px; }

    /* --- Stock meter --- */
    .stock-section {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }
    .section-title { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .meter-track {
      height: 14px;
      background: var(--surface-2);
      border-radius: 7px;
      overflow: visible;
      position: relative;
      margin-bottom: 6px;
    }
    .meter-fill {
      height: 100%;
      border-radius: 7px;
      transition: width 0.4s ease, background 0.3s;
    }
    .meter-rop {
      position: absolute;
      top: -4px;
      width: 2px;
      height: 22px;
      background: var(--amber-mid);
      border-radius: 1px;
    }
    .meter-rop::after {
      content: attr(data-label);
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--amber);
      white-space: nowrap;
      font-weight: 500;
    }
    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 18px;
    }

    /* --- Two column section --- */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

    /* --- Chart card --- */
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }
    .chart-wrap { position: relative; height: 180px; margin-top: 12px; }

    /* --- Feature importance bars --- */
    .feat-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .feat-name { font-size: 12px; color: var(--text-muted); width: 110px; flex-shrink: 0; text-align: right; }
    .feat-track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
    .feat-fill { height: 100%; background: var(--blue-mid); border-radius: 4px; }
    .feat-val { font-size: 11px; color: var(--text-faint); width: 30px; text-align: right; }

    /* --- Loader --- */
    .loader {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--green-mid), var(--blue-mid));
      animation: slide 1s linear infinite;
      z-index: 100;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .loader.active { display: block; }

    /* --- Skeleton --- */
    .skeleton { background: var(--surface-2); border-radius: 4px; animation: pulse 1.2s ease infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* --- Responsive --- */
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      aside { display: none; }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="loader" id="loader"></div>

<header>
  <div class="logo">Pharma<span>Cast</span></div>
  <div class="last-updated" id="last-updated">Loading…</div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-label">Drugs</div>
    <div id="drug-list"></div>
  </aside>

  <main id="main-content">
    <p style="color:var(--text-muted); font-size:13px;">Select a drug to view its decision.</p>
  </main>
</div>

<script>
  // -----------------------------------------------------------------------
  // CONFIG: point this at your FastAPI server
  // -----------------------------------------------------------------------
  const API_BASE = "https://mvp-ihq2.onrender.com";

  // -----------------------------------------------------------------------
  // State
  // -----------------------------------------------------------------------
  let drugs = [];
  let currentDrugId = null;
  let forecastChart = null;

  // -----------------------------------------------------------------------
  // Helpers
  // -----------------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const loader = () => $("loader").classList.add("active");
  const unloader = () => $("loader").classList.remove("active");

  async function apiFetch(path, opts = {}) {
    const res = await fetch(API_BASE + path, opts);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function badge(action) {
    const map = {
      OK: ["ok", "✓", "Stock healthy"],
      REORDER: ["reorder", "!", "Place order"],
      STOCKOUT: ["stockout", "✕", "Stockout — urgent"],
    };
    return map[action] || map["OK"];
  }

  function statusColor(action) {
    return { OK: "#639922", REORDER: "#BA7517", STOCKOUT: "#E24B4A" }[action] || "#888";
  }

  function fmt(n, d = 1) { return Number(n).toFixed(d); }

  // -----------------------------------------------------------------------
  // Boot: load drug list
  // -----------------------------------------------------------------------
  async function loadDrugs() {
    try {
      drugs = await apiFetch("/drugs");
      const list = $("drug-list");
      list.innerHTML = "";
      drugs.forEach(d => {
        const el = document.createElement("div");
        el.className = "drug-item";
        el.dataset.id = d.drug_id;
        el.innerHTML = `
          <span>${d.display_name}</span>
          <span class="drug-status-dot" style="background:#ccc;" data-dot="${d.drug_id}"></span>`;
        el.addEventListener("click", () => selectDrug(d.drug_id));
        list.appendChild(el);
      });
      // Auto-select first drug
      if (drugs.length) selectDrug(drugs[0].drug_id);
    } catch (e) {
      renderDemoMode();
    }
  }

  function selectDrug(id) {
    currentDrugId = id;
    document.querySelectorAll(".drug-item").forEach(el => {
      el.classList.toggle("active", el.dataset.id === id);
    });
    fetchForecast(id);
  }

  // -----------------------------------------------------------------------
  // Main fetch + render
  // -----------------------------------------------------------------------
  async function fetchForecast(drugId, stock = null, sl = null, lead = null) {
    loader();
    try {
      const body = {
        drug_id: drugId,
        current_stock: stock !== null ? parseInt(stock) : getStockInput(),
        service_level: sl !== null ? parseFloat(sl) : getSLInput(),
      };
      if (lead !== null) body.lead_time_override = parseInt(lead);

      const data = await apiFetch("/forecast", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      renderDashboard(data);
      updateDot(drugId, data.action);
      $("last-updated").textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (e) {
      // API not running — render with mock data so the UI is still visible
      renderDemoMode();
    } finally {
      unloader();
    }
  }

  function getStockInput() {
    const el = $("stock-input");
    return el ? parseInt(el.value) || 38 : 38;
  }
  function getSLInput() {
    const el = $("sl-select");
    return el ? parseFloat(el.value) : 0.95;
  }

  function updateDot(drugId, action) {
    const dot = document.querySelector(`[data-dot="${drugId}"]`);
    if (dot) dot.style.background = statusColor(action);
  }

  // -----------------------------------------------------------------------
  // Render dashboard
  // -----------------------------------------------------------------------
  function renderDashboard(d) {
    const [cls, icon, label] = badge(d.action);
    const ropPct = Math.min(98, (d.reorder_point / 50) * 100);
    const stockPct = Math.min(100, (d.current_stock / 50) * 100);
    const fillColor = { OK: "#639922", REORDER: "#BA7517", STOCKOUT: "#E24B4A" }[d.action];
    const maxFeat = Math.max(...Object.values(d.feature_importance));

    $("main-content").innerHTML = `

      <!-- Controls -->
      <div class="controls-row">
        <div class="ctrl-group">
          <label>Current stock (units)</label>
          <input id="stock-input" type="number" min="0" max="500" value="${d.current_stock}" style="width:110px;">
        </div>
        <div class="ctrl-group">
          <label>Service level</label>
          <select id="sl-select" style="width:110px;">
            <option value="0.80">80%</option>
            <option value="0.85">85%</option>
            <option value="0.90">90%</option>
            <option value="0.95" selected>95%</option>
            <option value="0.99">99%</option>
          </select>
        </div>
        <div class="ctrl-group">
          <label>Lead time override (days)</label>
          <input id="lead-input" type="number" min="1" max="90" placeholder="default" style="width:130px;">
        </div>
        <button class="btn" id="run-btn">Recalculate</button>
      </div>

      <!-- Decision banner -->
      <div class="banner ${cls}">
        <div class="banner-icon">${icon}</div>
        <div>
          <div class="banner-title">${label}</div>
          <div class="banner-msg">${d.action_message}</div>
        </div>
      </div>

      <!-- Metrics -->
      <div class="metrics-grid">
        <div class="metric">
          <div class="val">${d.current_stock}</div>
          <div class="lbl">Units in stock</div>
        </div>
        <div class="metric">
          <div class="val">${fmt(d.mean_daily_demand, 2)}</div>
          <div class="lbl">Mean demand / day</div>
          <div class="sub" style="color:var(--text-faint)">MAE ±0.75</div>
        </div>
        <div class="metric">
          <div class="val">${d.days_of_cover === Infinity ? "∞" : fmt(d.days_of_cover, 0)}</div>
          <div class="lbl">Days of cover</div>
        </div>
        <div class="metric">
          <div class="val">${d.reorder_point}</div>
          <div class="lbl">Reorder point</div>
          <div class="sub" style="color:var(--text-faint)">Safety stock: ${d.safety_stock}</div>
        </div>
        <div class="metric">
          <div class="val">${d.eoq}</div>
          <div class="lbl">Order qty (EOQ)</div>
        </div>
        <div class="metric">
          <div class="val" style="color:${d.stockout_risk_pct > 20 ? "var(--red)" : "var(--green)"}">${fmt(d.stockout_risk_pct, 1)}%</div>
          <div class="lbl">Stockout risk</div>
        </div>
      </div>

      <!-- Stock meter -->
      <div class="stock-section">
        <div class="section-title">Stock level vs reorder point</div>
        <div class="meter-track">
          <div class="meter-fill" style="width:${stockPct}%;background:${fillColor};"></div>
          <div class="meter-rop" style="left:${ropPct}%;" data-label="ROP (${d.reorder_point})"></div>
        </div>
        <div class="meter-labels">
          <span>0</span>
          <span>Max stock</span>
        </div>
      </div>

      <!-- 7-day forecast + feature importance -->
      <div class="two-col">
        <div class="card">
          <div class="section-title">7-day demand forecast</div>
          <div class="chart-wrap"><canvas id="forecast-chart"></canvas></div>
        </div>
        <div class="card">
          <div class="section-title">Feature importance</div>
          <div style="margin-top:12px;" id="feat-bars"></div>
        </div>
      </div>
    `;

    // Wire up recalculate button
    $("run-btn").addEventListener("click", () => {
      const stock = $("stock-input").value;
      const sl = $("sl-select").value;
      const lead = $("lead-input").value || null;
      fetchForecast(currentDrugId, stock, sl, lead);
    });

    // Render chart
    const ctx = $("forecast-chart").getContext("2d");
    if (forecastChart) forecastChart.destroy();
    const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const labels = d.forecast_dates.map((dt, i) => {
      const day = new Date(dt).getDay();
      return dayNames[day];
    });

    forecastChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "Forecast (units)",
          data: d.forecast_7d,
          backgroundColor: d.forecast_7d.map(v => v >= 1 ? "#1D9E75" : "#B4B2A9"),
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { font: { size: 11 } },
            grid: { color: "rgba(0,0,0,0.05)" },
          },
          x: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
      }
    });

    // Render feature importance bars
    const featBars = $("feat-bars");
    Object.entries(d.feature_importance).forEach(([name, val]) => {
      const pct = Math.round((val / maxFeat) * 100);
      featBars.innerHTML += `
        <div class="feat-bar-row">
          <div class="feat-name">${name}</div>
          <div class="feat-track"><div class="feat-fill" style="width:${pct}%"></div></div>
          <div class="feat-val">${val}</div>
        </div>`;
    });
  }

  // -----------------------------------------------------------------------
  // Demo mode (API not running)
  // -----------------------------------------------------------------------
  function renderDemoMode() {
    const mockDrugs = [
      { drug_id: "metformin_500mg", display_name: "Metformin 500mg" },
      { drug_id: "amlodipine_5mg",  display_name: "Amlodipine 5mg" },
    ];
    if (!drugs.length) {
      drugs = mockDrugs;
      const list = $("drug-list");
      list.innerHTML = "";
      mockDrugs.forEach(d => {
        const el = document.createElement("div");
        el.className = "drug-item" + (d.drug_id === "metformin_500mg" ? " active" : "");
        el.dataset.id = d.drug_id;
        el.innerHTML = `<span>${d.display_name}</span><span class="drug-status-dot" style="background:#639922;" data-dot="${d.drug_id}"></span>`;
        el.addEventListener("click", () => {});
        list.appendChild(el);
      });
    }

    const mockData = {
      drug_name: "Metformin 500mg", current_stock: 38,
      forecast_7d: [0.9, 0.7, 1.1, 0.8, 1.0, 0.6, 0.9],
      forecast_dates: Array.from({length:7}, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() + i);
        return d.toISOString().split("T")[0];
      }),
      mean_daily_demand: 0.87, forecast_std: 0.18,
      safety_stock: 5, reorder_point: 18, eoq: 30,
      days_of_cover: 43.7, stockout_risk_pct: 0.5,
      action: "OK",
      action_message: "Stock (38 units) is above the reorder point (18 units). ~44 days of cover — no action needed. [Demo mode: start FastAPI to see live data]",
      feature_importance: { time_index: 497, day_of_week: 246, rolling_28_mean: 215, month: 194, sales_lag_14: 84, sales_lag_7: 74 },
    };
    renderDashboard(mockData);
    $("last-updated").textContent = "Demo mode — API offline";
  }

  // -----------------------------------------------------------------------
  // Start
  // -----------------------------------------------------------------------
  loadDrugs();
</script>
</body>
</html>
